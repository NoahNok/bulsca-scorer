<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>You're offline - DigitalJudge</title>
    <!-- Served by judge-sw.js with no connection, so everything it needs is in this file -->
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-sizing: border-box;
            padding: 1.5rem;
            background: #fff;
            color: #111827;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main {
            width: 100%;
            max-width: 24rem;
            margin: 0 auto;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        p {
            margin: 0.5rem 0 1.5rem;
            color: #6b7280;
            font-size: 0.875rem;
            line-height: 1.4;
        }
        button {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 0;
            border-radius: 0.5rem;
            background: #00d5be;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:focus-visible {
            outline: 2px solid #111827;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <main>
        <h1>You're offline</h1>
        <p>Digital Judge needs a connection. This page will reload by itself when you're back online.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
        addEventListener("online", () => location.reload());
    </script>
</body>
</html>
